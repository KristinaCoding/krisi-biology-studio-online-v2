
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>KRISI Biology Studio | Reset Password</title>
    <link rel="stylesheet" href="/static/reset_password.css">

</head>
<body>
    <main>
        <h1>KRISI Biology Studio</h1>
        <h2>Reset Your Password</h2>

        <p>
            The secure password reset form
            is currently being prepared.
        </p>

<p
    id="recovery-message"
    role="status"
    aria-live="polite"
>
    Waiting for a verified password recovery session.
</p>

<form id="reset-password-form">
    <label for="new-password">New password</label>
    <input
        type="password"
        id="new-password"
        name="new-password"
        autocomplete="new-password"
        minlength="12"
        required
        disabled
    >

    <label for="confirm-password">
        Confirm new password
    </label>
    <input
        type="password"
        id="confirm-password"
        name="confirm-password"
        autocomplete="new-password"
        minlength="12"
        required
        disabled
    >

    <button type="submit" disabled>
        Reset Password
    </button>
</form>
        <p>
            Password changes are not enabled yet.
        </p>
    </main>

<script type="module" src="/static/supabase_recovery.js"></script>

</body>
</html>
